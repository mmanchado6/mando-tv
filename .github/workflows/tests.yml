# Ejecuta los tests unitarios de Mando TV en cada push y pull request.
# Usa las mismas versiones que docker/Dockerfile (JDK 21, Android SDK 37, Gradle 9.6.0)
# y solo acciones oficiales de GitHub. No compila el APK ni usa la clave de firma.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRADLE_VERSION: "9.6.0"
      GRADLE_SHA256: "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01"
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK 37
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Gradle ${{ env.GRADLE_VERSION }}
        run: |
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "${GRADLE_SHA256}  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Caché de dependencias
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Tests unitarios
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest

      - name: Informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests
          path: |
            app/build/reports/tests/testDebugUnitTest/
            salida/capturas/
          retention-days: 14
